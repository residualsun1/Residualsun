backend:
  name: github
  repo: residualsun1/Residualsun
  branch: main

locale: zh_Hans
site_url: https://guozheng.rbind.io
display_url: https://guozheng.rbind.io/moments/
publish_mode: simple
media_folder: static/images/moments
public_folder: /images/moments

collections:
  - name: moments
    label: 思绪
    label_singular: 思绪
    folder: content/moments
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    identifier_field: body
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    # Display-only separators; stored Markdown/front matter remain unchanged.
    summary: "{{date | date('YYYY-MM-DDTHH:mm:ssZ')}}\u001f{{title}}\u001f{{draft}}\u001f{{body}}"
    sortable_fields: [date]
    editor:
      preview: false
    fields:
      - name: date
        label: 时间
        widget: datetime
        default: "{{now}}"
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - name: title
        label: 标题
        widget: studio-title
        required: false
        default: ""
      - name: body
        label: 正文
        widget: studio-body
      - name: draft
        label: 发布设置
        widget: studio-draft
        required: false
        default: false
