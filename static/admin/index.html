<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>思绪 · 发布后台</title>
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
    <link href="admin.css" rel="stylesheet" />
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <header class="admin-intro">
      <a href="/">Residualsun</a>
      <h1>思绪</h1>
    </header>
    <noscript>请启用 JavaScript，才能使用思绪发布后台。</noscript>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
      const zh = CMS.getLocale("zh_Hans");
      CMS.registerLocale("zh_Hans", {
        ...zh,
        app: { ...zh.app, header: { ...zh.app.header, quickAdd: "新建" } },
        collection: {
          ...zh.collection,
          sidebar: { ...zh.collection.sidebar, collections: "导航", searchAll: "搜索思绪" },
          collectionTop: { ...zh.collection.collectionTop, newButton: "＋ 新建", newButtonAriaLabel: "新建思绪" },
        },
        editor: {
          ...zh.editor,
          editorToolbar: {
            ...zh.editor.editorToolbar,
            backCollection: "%{collectionLabel}",
            changesSaved: "已保存",
            unsavedChanges: "未保存",
            publishAndCreateNew: "发布并新建",
            publishAndDuplicate: "发布并复制",
            deployButtonLabel: "查看",
          },
        },
      });
      // The Hugo section settings share the notes folder but must never be edited here.
      CMS.registerEventListener({
        name: "preSave",
        handler: ({ entry }) => {
          if (entry.get("slug") === "_index" || entry.get("path") === "content/moments/_index.md") {
            throw new Error("这是思绪页面的目录配置，请返回并新建一条思绪。");
          }
          if (!entry.getIn(["data", "body"], "").trim()) {
            throw new Error("请先写下你的想法，再发布。");
          }
          return entry.get("data");
        },
      });
      CMS.init();
    </script>
  </body>
</html>
